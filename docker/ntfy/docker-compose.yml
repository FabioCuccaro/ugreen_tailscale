# OPTIONAL: ntfy on the NAS — push notifications to your phone, reachable from outside
# only through Tailscale. Paste into UGOS → Docker → Project, name "ntfy",
# folder docker/ntfy (guide: docs/ntfy.md, Italian: docs/it/ntfy.md).
# No secrets in here: users and passwords are created after the first start
# and live in the database in ./data, on the NAS.
#
# References (ntfy v2.30.0):
#   https://docs.ntfy.sh/install/#docker
#   https://docs.ntfy.sh/config/#access-control
#   https://docs.ntfy.sh/config/#config-options
services:
  ntfy:
    # v2 = latest 2.x: updates with "Redeploy" without jumping a major version.
    image: binwiederhier/ntfy:v2
    container_name: ntfy
    command: serve
    restart: unless-stopped
    # Required together with the healthcheck (per the ntfy docs).
    init: true
    environment:
      # Your time zone, e.g. Europe/Rome, America/New_York.
      TZ: Europe/Rome
      # Address your phone uses to reach ntfy: the Tailscale name of the NAS.
      NTFY_BASE_URL: http://nas:8090
      # Messages stored on disk: a phone that was offline gets them when it reconnects.
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      # Users and permissions. deny-all: without logging in, nothing can be read or written.
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # Login from the web app (http://nas:8090).
      NTFY_ENABLE_LOGIN: "true"
      # Attachments (pictures, files) sent with notifications.
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
    volumes:
      # Cache, users and attachments: Project folder, never in git.
      - ./data:/var/lib/ntfy
    ports:
      # NAS port 8090 → container port 80. If UGOS says it is taken, use another one
      # (e.g. 8091) and change NTFY_BASE_URL too.
      - "8090:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
