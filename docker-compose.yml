# Tailscale on a UGREEN NAS — PLAN A (kernel networking).
# Paste into UGOS → Docker → Project (see README.md, or docs/it/guida.md in Italian).
# Replace the values between < > before starting it.
# Once filled in, this file contains your auth key: keep it only on the NAS, never in git.
#
# Tested on a UGREEN DXP2800 with UGOS: UGOS accepts "devices" and "cap_add",
# and /dev/net/tun exists. If your model refuses them, use docker-compose.userspace.yml (plan B).
#
# References:
#   https://tailscale.com/kb/1282/docker
#   https://tailscale.com/kb/1019/subnets
services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    hostname: nas
    # Host network: the NAS itself joins your tailnet with a 100.x.y.z address,
    # so every service on the NAS (UGOS web UI, SMB shares, Plex, your containers...)
    # is reachable through it.
    network_mode: host
    restart: unless-stopped
    environment:
      # Auth key from https://login.tailscale.com/admin/settings/keys (one-off, not ephemeral).
      # Alternative: delete this line, start the container and open the login link
      # printed in its Logs. Either way, remove the key after the first successful start.
      TS_AUTHKEY: "<tailscale auth key>"
      # Log in only if the node is not already authenticated (state is kept in ./state).
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      # Kernel networking (TUN) instead of userspace networking.
      TS_USERSPACE: "false"
      # Name of the NAS in your tailnet: you will reach it as http://nas:<port>.
      TS_HOSTNAME: nas
      # Optional (README, "Use the NAS LAN address from outside"): also make the NAS's
      # home address reachable through Tailscale. Only the NAS itself (/32), never the
      # whole home network. IP forwarding is not required for a /32 that is the NAS's own
      # address (Tailscale source, net/netutil/ip_forward.go).
      # TS_ROUTES: "<NAS LAN IP>/32"
    volumes:
      # Node state (contains its keys): stays in the Project folder, never shared.
      - ./state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
