# Tailscale on a UGREEN NAS — PLAN B (userspace networking).
# Use it only if UGOS refuses docker-compose.yml (errors about /dev/net/tun,
# "devices" or "cap_add"). Same steps as plan A, only the pasted text changes.
# Replace the values between < > before starting it.
# Once filled in, this file contains your auth key: keep it only on the NAS, never in git.
#
# Difference from plan A: Tailscale runs in "userspace" mode, so it needs neither
# /dev/net/tun nor extra capabilities. A connection arriving at the node's 100.x.y.z
# address is forwarded to 127.0.0.1 on the same port; with the host network 127.0.0.1
# is the NAS, so http://nas:<port>, UGOS and the shared folders should answer as in plan A.
# The NAS, however, cannot open connections to the other devices in your tailnet
# (not needed to reach the NAS's own services).
#
# NOT YET TESTED ON A REAL NAS. Based on:
#   https://tailscale.com/kb/1282/docker (TS_USERSPACE defaults to "true")
#   Tailscale source v1.102.3, wgengine/netstack/netstack.go, acceptTCP:
#   in userspace mode, connections to the node's own Tailscale IP go to 127.0.0.1:<port>.
#   This is not in the official docs. If you try it, please report back in an issue.
services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    network_mode: host
    restart: unless-stopped
    environment:
      TS_AUTHKEY: "<tailscale auth key>"
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_HOSTNAME: nas
      # Optional, as in plan A. The /32 route should also work in userspace mode.
      # TS_ROUTES: "<NAS LAN IP>/32"
    volumes:
      - ./state:/var/lib/tailscale
